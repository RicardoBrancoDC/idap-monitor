services:
  - type: web
    name: idap-monitor
    runtime: python
    plan: starter
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python app.py --no-browser
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: IDAP_REPO_URL
        value: https://idapcap.mdr.gov.br/
      - key: IDAP_DATA_DIR
        value: /var/data
      - key: IDAP_BASIC_USER
        sync: false
      - key: IDAP_BASIC_PASSWORD
        sync: false
    disk:
      name: idap-data
      mountPath: /var/data
      sizeGB: 1
